name: Enterprise Employee Portal CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

env:
  NODE_VERSION: '20'

jobs:
  # =========================================================================
  # JOB 1: Frontend — Lint, Test, Build
  # =========================================================================
  frontend:
    name: Frontend (Lint → Test → Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package*.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci || npm install

      - name: Lint (ESLint)
        working-directory: ./client
        run: npm run lint

      - name: Run tests (Vitest)
        working-directory: ./client
        run: npm test

      - name: Build (Vite)
        working-directory: ./client
        env:
          VITE_API_BASE_URL: /api
        run: npm run build

  # =========================================================================
  # JOB 2: Backend — Lint, Test (with MySQL service)
  # =========================================================================
  backend:
    name: Backend (Lint → Test)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: eep_test
          MYSQL_USER: eep_user
          MYSQL_PASSWORD: eep_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package*.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci || npm install

      - name: Lint (ESLint)
        working-directory: ./server
        run: npm run lint

      - name: Syntax check
        working-directory: ./server
        run: node --check server.js

      - name: Run tests (Vitest + Supertest)
        working-directory: ./server
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: eep_test
          DB_USER: eep_user
          DB_PASSWORD: eep_ci_password
          DB_SYNC: 'true'
          DB_SYNC_ALTER: 'false'
          DB_SEED: 'false'
          JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-ok
          PORT: 3001
        run: npm test

  # =========================================================================
  # JOB 3: Docker Compose Validation
  # =========================================================================
  docker:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    needs: [ frontend, backend ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          echo "docker-compose.yml is valid."
